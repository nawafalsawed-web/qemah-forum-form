<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل زوار جناح قمة للمزادات · منتدى الصناعة السعودية 2026</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0907;--panel:#1A150F;--panel2:#241D14;--gold:#EDBC61;--gold-deep:#BD7800;--cream:#F3EAD7;--muted:#A89B84;--line:rgba(237,188,97,.28)}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Cairo',sans-serif;color:var(--gold);font-weight:800;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 110px}
header{text-align:center;padding:10px 0 18px}
header .t{font-size:22px;line-height:1.3}
header .s{color:var(--muted);font-size:13px;margin-top:4px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0 20px}
.usher{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:18px}
.usher input{flex:1;background:transparent;border:0;color:var(--gold);font:inherit;font-weight:600;font-size:14px;outline:0;text-align:right}
label.f{display:block;margin:0 0 14px}
label.f span,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--cream)}
.req::after{content:' *';color:var(--gold)}
input[type=text],input[type=tel],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--cream);font:inherit;font-size:16px;padding:12px 14px;outline:0}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--cream);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--gold);color:#1A1208;border-color:var(--gold);font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 22px;color:var(--cream)}
.consent input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px;flex:none}
button.go{width:100%;background:var(--gold);color:#1A1208;border:0;border-radius:14px;padding:16px;font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;cursor:pointer}
button.go:disabled{opacity:.6}
.err{color:#FF9F8A;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(13,9,7,.94);border-top:1px solid var(--line);padding:10px 18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
.badge{background:var(--gold-deep);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.badge[hidden]{display:none}
#done{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
#done[hidden]{display:none}
#done .big{font-family:'Cairo',sans-serif;font-size:34px;color:var(--gold);font-weight:800}
#done .nm{font-size:20px;margin:10px 0 30px}
#done button{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:14px 40px;font:inherit;font-size:18px;font-weight:600;cursor:pointer}
.logo{width:120px;margin:0 auto 8px;display:block}
</style>
</head>

</header>
<div class="rule"></div>

<div class="usher">المنظّم: <input id="usher" placeholder="اكتب اسمك مرة واحدة" maxlength="60"></div>

<form id="f" novalidate>
<label class="f"><span class="req">اسم الزائر</span><input type="text" id="name" maxlength="100" autocomplete="off" required></label>
<label class="f"><span class="req">رقم الجوال</span><input type="tel" id="phone" inputmode="tel" placeholder="05xxxxxxxx" maxlength="20" required></label>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyB6Wczw1P_HRH0duTe6mhp1AxheQ8_Necw",authDomain:"ahdaf-influencers.firebaseapp.com",projectId:"ahdaf-influencers",appId:"1:901322987426:web:13e998ecbabcfa3c0244fb"});
const db=firebase.firestore(), col=db.collection('qemah_visitors');
const CATS=['زائر عام','رجل أعمال أو شريك محتمل','صانع قرار','إعلامي','مسؤول أسطول أو منشأة'];
const INTS=['المزادات المباشرة','المزادات الأونلاين','فحص السيارات','نقل المركبات','بيع أسطول أو مركبات منشأة','شراكة أو استثمار','تغطية إعلامية','أخرى'];
const $=id=>document.getElementById(id);
const chips=(el,list,single)=>{list.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>{if(single)[...el.children].forEach(c=>c.classList.toggle('on',c===b));else b.classList.toggle('on')};el.appendChild(b)})};
chips($('cat'),CATS,true); chips($('int'),INTS,false);
const picked=el=>[...el.querySelectorAll('.on')].map(b=>b.textContent);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));

$('usher').value=LS('usher')||''; $('usher').onchange=()=>LS('usher',$('usher').value.trim());
const cnt=()=>{const c=LS('cnt')||{};$('cnt').textContent=c[today()]||0};cnt();

function normPhone(p){p=p.replace(/[^\d+]/g,'');if(p.startsWith('+'))p=p.slice(1);if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('05'))p='966'+p.slice(1);if(p.startsWith('5')&&p.length===9)p='966'+p;return p}

let queue=LS('queue')||[]; const showPend=()=>{$('pend').hidden=!queue.length;$('pend').textContent='بانتظار الإرسال: '+queue.length};showPend();
async function flush(){if(!queue.length||!navigator.onLine)return;const q=queue.slice();for(const d of q){try{await col.add({...d,ts:firebase.firestore.FieldValue.serverTimestamp()});queue=queue.filter(x=>x!==d);LS('queue',queue);showPend()}catch(e){if(e.code==='permission-denied'){queue=queue.filter(x=>x!==d);LS('queue',queue);showPend()}else break}}}
setInterval(flush,20000); addEventListener('online',flush); flush();

$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';
  const name=$('name').value.trim(), phone=normPhone($('phone').value), cat=picked($('cat'))[0];
  if(!name)return $('err').textContent='اكتب اسم الزائر';
  if(!/^9665\d{8}$/.test(phone)&&phone.length<9)return $('err').textContent='رقم الجوال غير صحيح';
  if(!cat)return $('err').textContent='اختر فئة الزائر';
  const d={name,phone,title:$('title').value.trim(),org:$('org').value.trim(),category:cat,interests:picked($('int')),note:$('note').value.trim(),consent:$('consent').checked,usher:($('usher').value||'').trim().slice(0,60),day:today(),source:'booth',status:'new'};
  $('go').disabled=true;
  try{await Promise.race([col.add({...d,ts:firebase.firestore.FieldValue.serverTimestamp()}),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))])}
  catch(err){if(err.code==='permission-denied'){$('go').disabled=false;return $('err').textContent='رُفض التسجيل، راجع البيانات'}queue.push(d);LS('queue',queue);showPend()}
  const c=LS('cnt')||{};c[today()]=(c[today()]||0)+1;LS('cnt',c);cnt();
  $('doneName').textContent=name; $('done').hidden=false; $('go').disabled=false;
};
$('again').onclick=()=>{$('f').reset();$('consent').checked=true;document.querySelectorAll('.chip.on').forEach(b=>b.classList.remove('on'));$('done').hidden=true;$('name').focus()};
</script>
</body>
</html>
